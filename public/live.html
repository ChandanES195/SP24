<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandan's Real-Time Signal Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(to right, #cdaacf, #b900b9);
            overflow: hidden;
            color: white;
        }

        .header {
            width: 100%;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to right, #22c55e, #06b6d4);
            border-bottom: 1px solid black;
            font-size: 28px;
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
            text-align: center;
        }

        .header span {
            display: inline-block;
        }

        .controls {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        #startBtn {
            background: rgba(53, 148, 52, 0.85);
            box-shadow: 0 0 10px #22c55e88;
        }

        #stopBtn {
            background: rgba(220, 38, 38, 0.9);
            box-shadow: 0 0 10px #ef444488;
        }

        .container {
            width: 100vw;
            height: calc(100vh - 70px);
            display: grid;
            grid-template-columns: 33.33% 33.33% 33.33%;
            gap: 10px;
            padding: 10px;
        }

        @media(max-width:900px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                overflow-y: auto;
                height: calc(100vh - 70px);
            }

            .card {
                min-height: 320px;
            }
        }

        .card {
            background: linear-gradient(to bottom, #ffffff, #00f2ff);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid black;
        }

        .card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0084ff;
        }

        .plotWrap {
            position: relative;
            width: 100%;
            height: 100%;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            left: 60px;
            top: 20px;
            width: calc(100% - 80px);
            height: calc(100% - 60px);
            background: black;
        }

        #colorbar {
            position: absolute;
            bottom: 41px;
            left: 54%;
            transform: translateX(-50%);
            width: 75%;
            height: 18px;
            border-radius: 10px;
            background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
            border: 1px solid white;
        }

        #colorbarLabels {
            position: absolute;
            bottom: 29px;
            left: 54%;
            transform: translateX(-50%);
            width: 75%;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: white;
        }

        .xlabel {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: bold;
            justify-content: center;
            color: cyan;
        }

        .ylabel {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: left top;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }

        .plotWrap {
            position: relative;
        }

        #tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.75);
            color: cyan;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: pre-line;
            line-height: 1.3;
            display: none;
            z-index: 20;
        }
    </style>
</head>

<body>
    <div class="header">
        Chandan's Real-Time Signal Analyzer
    </div>
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
    </div>
    <div class="container">
        <div class="card">
            <h2>Time Domain Signal</h2>
            <div class="plotWrap">
                <div class="ylabel">Amplitude</div>
                <canvas id="timeCanvas"></canvas>
                <div class="xlabel">Time (Samples)</div>
            </div>
        </div>
        <div class="card">
            <h2>Single-Sided FFT Spectrum</h2>
            <div class="plotWrap">
                <div class="ylabel">Magnitude (dB)</div>
                <canvas id="fftCanvas"></canvas>
                <div class="xlabel">Frequency (kHz)</div>
            </div>
        </div>
        <div class="card">
            <h2>Spectrogram</h2>
            <div class="plotWrap">
                <div class="ylabel">Frequency (kHz)</div>
                <canvas id="specCanvas"></canvas>
                <div id="colorbarLabels">
                    <span>-120 dB</span>
                    <span>-90 dB</span>
                    <span>-60 dB</span>
                    <span>-30 dB</span>
                    <span>0 dB</span>
                </div>
                <div id="colorbar"></div>
                <div class="xlabel">Time (Samples)</div>
            </div>
        </div>
    </div>
    <div id="tooltip"></div>
    <script>
        const FFT_SIZE = 2048;
        let audioCtx;
        let analyser;
        let micStream;
        let running = false;
        const signal = new Float32Array(FFT_SIZE);
        let previousFFT = [];
        const timeCanvas = document.getElementById("timeCanvas");
        const fftCanvas = document.getElementById("fftCanvas");
        const specCanvas = document.getElementById("specCanvas");
        const tctx = timeCanvas.getContext("2d");
        const fctx = fftCanvas.getContext("2d");
        const sctx = specCanvas.getContext("2d");
        const PLOT_MARGIN_LEFT = 35;
        const PLOT_MARGIN_RIGHT = 15;
        const PLOT_MARGIN_TOP = 15;
        const PLOT_MARGIN_BOTTOM = 35;
        let currentFFT = null;
        const tooltip = document.getElementById("tooltip");
        function updateTooltip(text, pageX, pageY) {
            tooltip.textContent = text;
            tooltip.style.left = pageX + 12 + "px";
            tooltip.style.top = pageY + 12 + "px";
            tooltip.style.display = "block";
        }
        function hideTooltip() {
            tooltip.style.display = "none";
        }
        function canvasPosition(evt, canvas) {
            const rect = canvas.getBoundingClientRect();
            return { x: evt.clientX - rect.left, y: evt.clientY - rect.top, rect };
        }
        function attachPlotTip(canvas, updateText) {
            canvas.addEventListener("mousemove", (evt) => {
                const pos = canvasPosition(evt, canvas);
                const w = canvas.width;
                const h = canvas.height;
                const plotLeft = PLOT_MARGIN_LEFT;
                const plotRight = w - PLOT_MARGIN_RIGHT;
                const plotTop = PLOT_MARGIN_TOP;
                const plotBottom = h - PLOT_MARGIN_BOTTOM;
                const plotW = plotRight - plotLeft;
                const plotH = plotBottom - plotTop;
                if (pos.x < plotLeft || pos.x > plotRight || pos.y < plotTop || pos.y > plotBottom) {
                    hideTooltip();
                    return;
                }
                const text = updateText(pos.x, pos.y, plotLeft, plotTop, plotW, plotH);
                if (text) updateTooltip(text, evt.pageX, evt.pageY);
                else hideTooltip();
            });
            canvas.addEventListener("mouseleave", hideTooltip);
        }
        function resize() {
            timeCanvas.width = timeCanvas.clientWidth;
            timeCanvas.height = timeCanvas.clientHeight;
            fftCanvas.width = fftCanvas.clientWidth;
            fftCanvas.height = fftCanvas.clientHeight;
            specCanvas.width = specCanvas.clientWidth;
            specCanvas.height = specCanvas.clientHeight;
        }
        window.addEventListener("resize", resize);
        resize();
        attachPlotTip(timeCanvas, (x, y, left, top, width, height) => {
            if (!signal.some((v) => Math.abs(v) > 1e-6)) return "";
            const index = Math.min(signal.length - 1, Math.max(0, Math.round(((x - left) / width) * (signal.length - 1))));
            return `Time: ${index}\nAmp: ${signal[index].toFixed(3)}`;
        });
        attachPlotTip(fftCanvas, (x, y, left, top, width, height) => {
            if (!currentFFT || !audioCtx) return "";
            const half = currentFFT.length / 2;
            const index = Math.min(half - 1, Math.max(0, Math.round(((x - left) / width) * (half - 1))));
            const re = currentFFT[index].re;
            const im = currentFFT[index].im;
            const mag = (re * re + im * im) / (half * half);
            const db = 10 * Math.log10(mag + 1e-12);
            const freq = ((index / half) * (audioCtx.sampleRate / 2)) / 1000;
            return `Freq: ${freq.toFixed(2)} kHz\nMag: ${db.toFixed(1)} dB`;
        });
        attachPlotTip(specCanvas, (x, y, left, top, width, height) => {
            if (!currentFFT || !audioCtx) return "";
            const half = currentFFT.length / 2;
            const fracX = (x - left) / width;
            const fracY = 1 - (y - top) / height;
            const timeIndex = Math.min(signal.length - 1, Math.max(0, Math.round(fracX * (signal.length - 1))));
            const freqIndex = Math.min(half - 1, Math.max(0, Math.round(fracY * (half - 1))));
            const re = currentFFT[freqIndex].re;
            const im = currentFFT[freqIndex].im;
            const mag = (re * re + im * im);
            const db = 10 * Math.log10(mag + 1e-12);
            const freq = (fracY * (audioCtx.sampleRate / 2)) / 1000;
            return `Time: ${timeIndex}\nFreq: ${freq.toFixed(2)} kHz\nMag: ${db.toFixed(1)} dB`;
        });
        document.getElementById("startBtn").onclick = async () => {
            if (running) return;
            if (!audioCtx) {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = FFT_SIZE;
                const mic = audioCtx.createMediaStreamSource(micStream);
                mic.connect(analyser);
            }
            running = true;
            animate();
        };
        document.getElementById("stopBtn").onclick = () => {
            running = false;
        };
        function animate() {
            if (!running) return;
            requestAnimationFrame(animate);
            analyser.getFloatTimeDomainData(signal);
            drawTime();
            const dc = removeDC(signal);
            const windowed = applyHannWindow(dc);
            const fft = FFT(windowed);
            currentFFT = fft;
            drawFFT(fft);
            drawSTFT(fft);
        }
        function removeDC(x) {
            let mean = 0;
            for (let i = 0; i < x.length; i++) {
                mean += x[i];
            }
            mean /= x.length;
            const out = new Float32Array(x.length);
            for (let i = 0; i < x.length; i++) {
                out[i] = x[i] - mean;
            }
            return out;
        }
        function applyHannWindow(x) {
            const N = x.length;
            const out = new Float32Array(N);
            for (let n = 0; n < N; n++) {
                const w = 0.5 * (1 - Math.cos((2 * Math.PI * n) / (N - 1)));
                out[n] = x[n] * w;
            }
            return out;
        }
        function drawTime() {
            const w = timeCanvas.width;
            const h = timeCanvas.height;
            const plotLeft = PLOT_MARGIN_LEFT;
            const plotRight = w - PLOT_MARGIN_RIGHT;
            const plotTop = PLOT_MARGIN_TOP;
            const plotBottom = h - PLOT_MARGIN_BOTTOM;
            const plotW = plotRight - plotLeft;
            const plotH = plotBottom - plotTop;
            tctx.clearRect(0, 0, w, h);
            tctx.strokeStyle = "#444";
            tctx.fillStyle = "white";
            tctx.font = "12px Arial";
            tctx.textAlign = "right";
            tctx.textBaseline = "middle";
            for (let a = -1; a <= 1; a += 0.5) {
                const y = plotTop + ((1 - a) / 2) * plotH;
                tctx.beginPath();
                tctx.moveTo(plotLeft, y);
                tctx.lineTo(plotRight, y);
                tctx.stroke();
                tctx.fillText(a.toFixed(1), plotLeft - 8, y);
            }
            tctx.textAlign = "center";
            tctx.textBaseline = "top";
            for (let i = 0; i <= 10; i++) {
                const x = plotLeft + (i / 10) * plotW;
                tctx.beginPath();
                tctx.moveTo(x, plotTop);
                tctx.lineTo(x, plotBottom);
                tctx.stroke();
                tctx.fillText(i * 10, x, plotBottom + 4);
            }
            tctx.strokeStyle = "#22c55e";
            tctx.lineWidth = 2;
            tctx.beginPath();
            for (let i = 0; i < signal.length; i++) {
                const x = plotLeft + (i / signal.length) * plotW;
                const y = plotTop + (0.5 - signal[i] / 2) * plotH;
                if (i === 0) tctx.moveTo(x, y);
                else tctx.lineTo(x, y);
            }
            tctx.stroke();
        }
        function drawFFT(fft) {
            const w = fftCanvas.width;
            const h = fftCanvas.height;
            const plotLeft = PLOT_MARGIN_LEFT;
            const plotRight = w - PLOT_MARGIN_RIGHT;
            const plotTop = PLOT_MARGIN_TOP;
            const plotBottom = h - PLOT_MARGIN_BOTTOM;
            const plotW = plotRight - plotLeft;
            const plotH = plotBottom - plotTop;
            fctx.clearRect(0, 0, w, h);
            fctx.strokeStyle = "#444";
            fctx.fillStyle = "white";
            fctx.font = "12px Arial";
            fctx.textAlign = "right";
            fctx.textBaseline = "middle";
            for (let d = -120; d <= 0; d += 20) {
                const y = plotTop + (1 - (d + 120) / 120) * plotH;
                fctx.beginPath();
                fctx.moveTo(plotLeft, y);
                fctx.lineTo(plotRight, y);
                fctx.stroke();
                fctx.fillText(d, plotLeft - 8, y);
            }
            const Fs = audioCtx.sampleRate;
            fctx.textAlign = "center";
            fctx.textBaseline = "top";
            for (let k = 0; k <= 8; k++) {
                const x = plotLeft + (k / 8) * plotW;
                const freq = Math.round((Fs / 2) * (k / 8));
                fctx.beginPath();
                fctx.moveTo(x, plotTop);
                fctx.lineTo(x, plotBottom);
                fctx.stroke();
                fctx.fillText((freq / 1000), x, plotBottom + 4);
            }
            const half = fft.length / 2;
            fctx.strokeStyle = "#38bdf8";
            fctx.lineWidth = 2;
            fctx.beginPath();
            for (let i = 0; i < half; i++) {
                const re = fft[i].re;
                const im = fft[i].im;
                const mag = (re * re + im * im) / (half * half);
                const db = 10 * Math.log10(mag + 1e-12);
                const alpha = 0.88;
                const smooth = previousFFT[i] !== undefined ? alpha * previousFFT[i] + (1 - alpha) * db : db;
                previousFFT[i] = smooth;
                const clamp = Math.max(-120, Math.min(0, smooth));
                const x = plotLeft + (i / half) * plotW;
                const y = plotTop + (1 - (clamp + 120) / 120) * plotH;
                if (i === 0) fctx.moveTo(x, y);
                else fctx.lineTo(x, y);
            }
            fctx.stroke();
        }
        function drawSTFT(fft) {
            const w = specCanvas.width;
            const h = specCanvas.height;
            const plotLeft = PLOT_MARGIN_LEFT - 15;
            const plotRight = w - PLOT_MARGIN_RIGHT;
            const plotTop = PLOT_MARGIN_TOP;
            const plotBottom = h - PLOT_MARGIN_BOTTOM;
            const plotW = plotRight - plotLeft;
            const plotH = plotBottom - plotTop;
            const imageData = sctx.getImageData(plotLeft + 1, plotTop, plotW - 1, plotH);
            sctx.putImageData(imageData, plotLeft, plotTop);
            const half = fft.length / 2;
            for (let i = 0; i < half; i++) {
                const re = fft[i].re;
                const im = fft[i].im;
                const mag = re * re + im * im;
                let db = 10 * Math.log10(mag + 1e-12);
                db = Math.max(-120, Math.min(0, db));
                const norm = (db + 120) / 120;
                const y = plotBottom - (i / half) * plotH;
                const r = Math.floor(255 * norm);
                const g = Math.floor(255 * Math.sin(norm * Math.PI));
                const b = Math.floor(255 * (1 - norm));
                sctx.fillStyle = `rgb(${r},${g},${b})`;
                sctx.fillRect(plotRight - 1, y, 1, 2);
            }
            sctx.strokeStyle = "rgba(255,255,255,0.5)";
            sctx.lineWidth = 1;
            sctx.font = "11px Arial";
            sctx.fillStyle = "white";
            sctx.textAlign = "right";
            sctx.textBaseline = "middle";
            for (let k = 0; k <= 15; k++) {
                const y = plotTop + (k / 15) * plotH;
                sctx.beginPath();
                sctx.moveTo(plotLeft, y);
                sctx.lineTo(plotRight, y);
                sctx.stroke();
                const freq = Math.round((15 - k) * (audioCtx.sampleRate / 2) / 15 / 1000);
                sctx.fillText(freq, plotLeft - 8, y);
            }
        }
        function FFT(x) {
            const N = x.length;
            if (N <= 1) {
                return [{ re: x[0], im: 0 }];
            }
            const even = FFT(x.filter((_, i) => i % 2 === 0));
            const odd = FFT(x.filter((_, i) => i % 2 !== 0));
            const out = new Array(N);
            for (let k = 0; k < N / 2; k++) {
                const angle = -2 * Math.PI * k / N;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                const tre = cos * odd[k].re - sin * odd[k].im;
                const tim = sin * odd[k].re + cos * odd[k].im;
                out[k] = {
                    re: even[k].re + tre,
                    im: even[k].im + tim
                };
                out[k + N / 2] = {
                    re: even[k].re - tre,
                    im: even[k].im - tim
                };
            }
            return out;
        }
    </script>
</body>

</html>
